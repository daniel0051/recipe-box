<div class="recipe-card">
  <h2 class="recipe-title">{{ recipe().name }}</h2>
  <img class="recipe-image" [src]="recipe().imgUrl" [alt]="recipe().name" />
  <p class="recipe-desc">{{ recipe().description }}</p>

  <div class="servings-control">
    <button (click)="decreaseServings()">-</button>
    <span>Porções: {{ servings() }}</span>
    <button (click)="increaseServings()">+</button>
  </div>

  <div class="ingredient-box">
    <h3>Ingrediente em destaque:</h3>
    <ul>
      @for (ingredient of adjustedIngredients(); track ingredient.name) {
        <li>
          <strong>{{ ingredient.name }}</strong
          >: {{ ingredient.quantity }} {{ ingredient.unit }}
        </li>
      }
    </ul>
  </div>
</div>
